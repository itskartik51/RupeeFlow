name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Auto-Find Project and Build APK
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        # 1. gradlew ki asli location dhundo (chahe wo kisi bhi folder me ho)
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found in the repository!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found Android project at: $PROJECT_DIR"
        
        # 2. Us exact folder me jao
        cd "$PROJECT_DIR"
        
        # 3. Google Services JSON ko app/ folder me banao
        mkdir -p app
        echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        
        # 4. Permission do aur Debug APK Build karo
        chmod +x gradlew
        ./gradlew assembleDebug
