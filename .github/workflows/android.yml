name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# NEW: Required to push the APK and version.json back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0 

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        cache-disabled: true
        generate-job-summary: false

    - name: Create Google Services JSON
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app
        cat << 'EOF' > app/google-services.json
        ${{ secrets.GOOGLE_SERVICES_JSON }}
        EOF

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: RupeeFlow-App-Release
        path: app/build/outputs/apk/release/*.apk

    # ==========================================
    # MAGIC SCRIPT: AUTO-SYNC JSON & APK DEPLOYMENT
    # ==========================================
    - name: Auto-Sync Version & Deploy Update
      if: contains(github.event.head_commit.message, '[RUN]')
      run: |
        echo "Step 1: Extracting version info from build.gradle.kts..."
        V_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        V_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        
        echo "Found Version Code: $V_CODE"
        echo "Found Version Name: $V_NAME"
        
        echo "Step 2: Preparing Updates folder..."
        mkdir -p Updates
        
        echo "Step 3: Creating version.json automatically..."
        cat <<EOF > Updates/version.json
        {
          "latest_version_code": $V_CODE,
          "latest_version_name": "v$V_NAME",
          "release_notes": "Automated update deployment via GitHub Actions.",
          "apk_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/Updates/RupeeFlow_Update.apk"
        }
        EOF
        
        echo "Step 4: Copying new APK to Updates folder..."
        # Finds the exact generated APK path dynamically
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        cp $APK_PATH Updates/RupeeFlow_Update.apk
        
        echo "Step 5: Committing and Pushing seamlessly..."
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add Updates/version.json Updates/RupeeFlow_Update.apk
        
        # [skip ci] prevents an infinite build loop
        git commit -m "Auto-Deploy Update v$V_NAME [skip ci]" || echo "Nothing to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
