name: Build RupeeFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0 

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Safe Environment Setup
      run: gradle wrapper --gradle-version 8.7

    - name: Setup Permanent Release Keystore
      run: |
        if [ ! -f release.keystore ]; then
          echo "Generating new permanent release keystore..."
          keytool -genkey -v -keystore release.keystore -storepass rupeeflow2026 -alias rupeeflow -keypass rupeeflow2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RupeeFlow,O=Kartikey,C=IN"
          
          echo "Configuring git..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Saving keystore..."
          git add release.keystore
          git commit -m "Add permanent release keystore [skip ci]" || echo "Nothing to commit"
          
          echo "Pushing securely bypassing prompts..."
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "Failed to push"
        else
          echo "Using existing permanent release keystore..."
        fi

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RupeeFlow-App-Release
        path: app/build/outputs/apk/release/app-release.apk

    # ==========================================
    # MAGIC SCRIPT: AUTO-SYNC JSON & APK DEPLOYMENT
    # ==========================================
    - name: Auto-Sync Version & Deploy Update
      if: contains(github.event.head_commit.message, '[RUN]')
      run: |
        echo "Step 1: Extracting version info from build.gradle.kts..."
        V_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        V_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        
        echo "Found Version Code: $V_CODE"
        echo "Found Version Name: $V_NAME"
        
        echo "Step 2: Preparing Updates folder..."
        mkdir -p Updates
        
        echo "Step 3: Creating version.json automatically..."
        cat <<EOF > Updates/version.json
        {
          "latest_version_code": $V_CODE,
          "latest_version_name": "v$V_NAME",
          "release_notes": "Automated update deployment via GitHub Actions.",
          "apk_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/Updates/RupeeFlow_Update.apk"
        }
        EOF
        
        echo "Step 4: Copying new APK to Updates folder..."
        cp app/build/outputs/apk/release/app-release.apk Updates/RupeeFlow_Update.apk
        
        echo "Step 5: Committing and Pushing seamlessly..."
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add Updates/version.json Updates/RupeeFlow_Update.apk
        
        # [skip ci] is used so it doesn't trigger another build infinitely
        git commit -m "Auto-Deploy Update v$V_NAME [skip ci]" || echo "Nothing to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
