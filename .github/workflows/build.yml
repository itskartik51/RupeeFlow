name: Build RupeeFlow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 1. YAHAN DIRECT PERMISSION ADD KI HAI TAAKI PASSWORD NA MANGE
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # 2. FETCH DEPTH ZERO KIYA HAI TAAKI PUSH AARAM SE HO
        fetch-depth: 0 

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Safe Environment Setup
      run: gradle wrapper --gradle-version 8.7

    - name: Setup Permanent Release Keystore
      run: |
        if [ ! -f release.keystore ]; then
          echo "Generating new permanent release keystore..."
          keytool -genkey -v -keystore release.keystore -storepass rupeeflow2026 -alias rupeeflow -keypass rupeeflow2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RupeeFlow,O=Kartikey,C=IN"
          
          echo "Configuring git..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Saving keystore..."
          git add release.keystore
          git commit -m "Add permanent release keystore [skip ci]" || echo "Nothing to commit"
          
          echo "Pushing securely bypassing prompts..."
          # 3. DIRECT TOKEN WALA PUSH TAAKI TERMINAL HANG NA HO
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "Failed to push"
        else
          echo "Using existing permanent release keystore..."
        fi

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: RupeeFlow-App-Release
        path: app/build/outputs/apk/release/app-release.apk
